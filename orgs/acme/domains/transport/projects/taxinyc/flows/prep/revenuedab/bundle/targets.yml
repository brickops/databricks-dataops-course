targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
    # variables:
    #   catalog: taxinyc
    #   schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-639f4875-165d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pal.de.vibe@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pal.de.vibe@gmail.com/.bundle/${bundle.name}/${bundle.target}
    # variables:
    #   catalog: taxinyc
    #   schema: prod
    permissions:
      - user_name: pal.de.vibe@gmail.com
        level: CAN_MANAGE


